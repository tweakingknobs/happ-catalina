name: Build Happ Catalina

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build application
        run: |
          chmod +x Scripts/build.sh
          ./Scripts/build.sh

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/VPN.app VPN-Catalina.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Happ-Catalina
          path: VPN-Catalina.zip
          retention-days: 7
