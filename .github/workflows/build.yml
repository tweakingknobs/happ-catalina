name: Build Happ Catalina

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x Scripts/build.sh
          ./Scripts/build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent build/VPN.app Happ-Catalina.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Happ-Catalina
          path: Happ-Catalina.zip
